apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: cloud-native-microservice
  title: Cloud-Native Microservice (Golden Path)
  description: Scaffolds a production-ready microservice with automated GitOps deployment and AWS S3 storage.
  tags:
    - recommended
    - kubernetes
    - aws
    - gitops
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Service Configuration
      required:
        - component_id
        - owner
      properties:
        component_id:
          title: Service Name
          type: string
          description: Unique name for your microservice (e.g. payment-service)
        description:
          title: Description
          type: string
          description: What does this service do?
        owner:
          title: Team Owner
          type: string
          default: platform
          description: Team responsible for this service (e.g. platform, billing)

  steps:
    - id: fetch-base
      name: Generate Skeleton Files
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.component_id }}
          description: ${{ parameters.description or "Cloud-native microservice created via Backstage Golden Path" }}
          owner: ${{ parameters.owner }}

    - id: publish-to-git
      name: Publish to GitOps Repo
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=cloud-native-idp&owner=Muhammad-Zubair796
        branchName: add-${{ parameters.component_id }}
        title: "feat(apps): scaffold ${{ parameters.component_id }}"
        description: ${{ parameters.description or "Cloud-native microservice created via Backstage Golden Path" }}
        targetPath: apps/${{ parameters.component_id }}
