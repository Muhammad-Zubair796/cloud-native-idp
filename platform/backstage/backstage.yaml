apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-custom-config
  namespace: backstage
data:
  app-config.production.yaml: |
    app:
      baseUrl: http://54.208.74.125:30007
    backend:
      baseUrl: http://54.208.74.125:30007
      listen:
        port: 7007
      cors:
        origin: http://54.208.74.125:30007
      csp:
        upgrade-insecure-requests: false
    auth:
      environment: development
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true
    catalog:
      locations:
        - type: url
          target: https://github.com/Muhammad-Zubair796/cloud-native-idp/blob/main/apps/demo-web-service/catalog-info.yaml
        - type: url
          target: https://github.com/Muhammad-Zubair796/cloud-native-idp/blob/main/templates/golden-path-service/template.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: backstage
  labels:
    app: postgres
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        team: platform
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgrespassword
        - name: POSTGRES_DB
          value: backstage
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: backstage
  labels:
    team: platform
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app: backstage
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
        team: platform
    spec:
      volumes:
      - name: custom-config
        configMap:
          name: backstage-custom-config
      containers:
      - name: backstage
        image: ghcr.io/backstage/backstage:latest
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: custom-config
          mountPath: /app/app-config.production.yaml
          subPath: app-config.production.yaml
        env:
        - name: POSTGRES_HOST
          value: postgres-service
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgrespassword
        ports:
        - containerPort: 7007
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backstage-service
  namespace: backstage
  labels:
    team: platform
spec:
  type: NodePort
  ports:
  - name: http
    port: 7007
    targetPort: 7007
    nodePort: 30007
  selector:
    app: backstage
